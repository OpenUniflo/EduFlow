const contexts=[['course','AI Agent 开发基础','课程'],['question','工具调用 · 当前题目','题目'],['task','Agent 工作流实践','实践'],['node','工具调用','技能节点'],['route','AI Agent 课程路线','路线'],['old','之前的 Agent 架构讨论','历史对话']];
function composer(kind='main'){const draft=kind==='main'?st.draft:st.sideAiDraft;const showPop=st.contextOpen;return `<div class="prompt-area"><div class="composer">${st.context.length?`<div class="ref-list">${st.context.map(k=>{const c=contexts.find(x=>x[0]===k);return `<span class="ref-chip">${I('paperclip','sm')} ${esc(k==='old'&&st.historySnippet?'历史：'+st.historySnippet.slice(0,16):c?.[1]||k)} <button data-act="unref" data-id="${k}" title="移除引用">${I('x','sm')}</button></span>`}).join('')}</div>`:''}<textarea id="${kind==='main'?'main-draft':'side-draft'}" placeholder="输入问题，或添加上下文……" aria-label="向 EduFlow 输入消息">${esc(draft)}</textarea><div class="composer-bottom"><div class="comp-left"><button class="icon-btn" data-act="context-menu" title="添加上下文" aria-label="添加上下文">${I('plus')}</button><button class="icon-btn" data-act="attach-chat" title="添加文件（本地演示）">${I('paperclip')}</button><span class="fine" style="font-size:10px">引用课程、题目、实践或资料</span></div><div class="comp-right"><button class="btn primary" data-act="send" data-kind="${kind}" title="发送消息">${I('arrowright')}</button></div></div></div></div>${showPop?contextMenu():''}`}
function contextMenu(){return `<div class="context-popup"><div class="context-head">引用到当前消息 <span style="float:right;cursor:pointer" data-act="context-menu">${I('x','sm')}</span></div>${contexts.map(c=>`<div class="context-row" data-act="toggle-ref" data-id="${c[0]}">${I(c[0]==='old'?'clock':c[0]==='node'?'network':c[0]==='question'?'info':c[0]==='task'?'file':c[0]==='route'?'route':'book','sm')}<div class="info"><strong>${esc(c[0]==='old'&&st.historySnippet?'历史：'+st.historySnippet.slice(0,18):c[1])}</strong><small>${esc(c[2])} · ${c[0]==='old'?'按需加入历史上下文':'当前可用引用'}</small></div>${st.context.includes(c[0])?I('check','sm'):I('plus','sm')}</div>`).join('')}<div class="divider" style="margin:8px 0"></div><div class="context-row" data-act="attach-chat">${I('paperclip','sm')}<div class="info"><strong>文件 / 图片</strong><small>演示模式仅使用本地文件名</small></div></div></div>`}
function workbench(){if(st.workspace.mode==='R'&&st.workspace.type){return `<div class="workspace-root mode-R" style="--chat-share:${st.chatShare}%"><div class="chat-lane"><div class="chat-scroll"><div class="chat-inner">${guide()}${msgContent()}</div></div>${composer()}</div><div class="splitter" data-splitter="true" role="separator" aria-orientation="vertical" tabindex="0" aria-label="拖动调整对话与工作空间宽度" title="拖动调整分栏宽度"></div><div class="work-holder">${workCard(false)}</div></div>`}return `<div class="workspace-root mode-${st.workspace.mode}"><div class="chat-lane"><div class="chat-scroll"><div class="chat-inner">${workIntro()}${guide()}${msgContent()}</div>${st.workspace.type?st.workspace.mode==='L'?`<div class="inline-wide">${workCard(false)}</div>`:`<div class="chat-inner">${smallCard()}</div>`:''}${suggestions()}</div>${composer()}</div></div>`}
function smallCard(){const w=st.workspace;const status=w.type==='micro'?(st.micro.completed?'已完成':'等待作答'):w.type==='practice'?(st.practice.submitted?'已提交（模拟）':'可编辑草稿'):'交互预览';return `<article class="card-s"><div class="card-main"><div class="card-top"><span class="card-title" style="display:flex;gap:9px;align-items:center">${I(icons[w.type])}${labels[w.type]}</span><div class="card-actions"><button class="toolbtn" title="展开大型卡片 (L)" data-act="mode" data-mode="L">${I('expand','sm')}</button><button class="toolbtn" title="在右侧打开 (R)" data-act="mode" data-mode="R">${I('right','sm')}</button><button class="toolbtn" title="关闭卡片" data-act="close-work">${I('x','sm')}</button></div></div><div class="card-desc">${w.type==='skill'?'AI Agent 开发基础 · 六个知识节点与前置关系':w.type==='capability'?'已确认能力、目标差距及对应证据':w.type==='route'?'AI Agent 开发基础 · 当前已采用的个人路线':w.type==='micro'?'工具调用基础 · 通过互动问题理解工具选择':w.type==='practice'?'Agent 工作流实践 · 编辑或上传成果并确认提交':'自由创建、编辑和模拟运行工作流'}</div><div class="small-mini">${graphView[w.type]?graphFrame(graphView[w.type]):w.type==='skill'?miniSkill():w.type==='route'?`<div style="width:88%;font-size:12px;color:#697078;display:grid;gap:7px"><div>${I('check','sm')} 认识 Agent 架构</div><div>${I('arrowright','sm')} 工具调用实践</div></div>`:I(icons[w.type],'xl')}</div></div><div class="card-footer"><span>${status} · 可展开为大型工作空间</span><button class="btn small" data-act="mode" data-mode="L">打开 ${I('arrowright','sm')}</button></div></article>`}
function graphFrame(view){return `<iframe class="graph-frame" src="/dynamic-workspace/graph/index.html?embed=1&view=${view}" title="知识世界、能力路线、课程泳道"></iframe>`;}

function workCard(isFull){const w=st.workspace;return `<div class="work-card"><div class="work-head"><div class="work-title">${I(icons[w.type]||'work')}<span>${labels[w.type]||'工作空间'}</span><span class="work-subtitle">${w.type==='workflow'?'独立工具项目':w.type==='capability'?'个人能力视图':'AI Agent 开发基础'}</span></div><div class="work-actions"><button class="toolbtn mobile-return" data-act="mode" data-mode="S" title="返回主对话">${I('message','sm')}</button>${['S','L','R','F'].map((m)=>`<button class="toolbtn ${w.mode===m?'active':''}" data-act="mode" data-mode="${m}" title="${{S:'收起为小卡片',L:'大型内联卡片',R:'在右侧打开',F:'沉浸模式'}[m]}">${I({S:'shrink',L:'expand',R:'right',F:'grid'}[m],'sm')}</button>`).join('')}<button class="toolbtn" data-act="close-work" title="关闭工作空间">${I('x','sm')}</button></div></div><div class="work-body">${workspaceBody()}</div></div>`}
function workspaceBody(){switch(st.workspace.type){case 'skill':return skillBody();case 'capability':return capabilityBody();case 'route':return routeBody();case 'micro':return microBody();case 'practice':return practiceBody();case 'workflow':return workflowBody();default:return ''}}
function skillBody(){let sel=nodes[st.workspace.selected]||nodes.tools;let z=st.workspace.zoom;const xy={base:[270,40],model:[83,140],tools:[270,140],memory:[457,140],planning:[175,243],project:[365,243]};const edges=[['base','model'],['base','tools'],['base','memory'],['tools','planning'],['tools','project'],['memory','project']];return `<div class="work-two"><div><div class="stage"><div class="stage-actions"><button class="toolbtn" data-act="zoom" data-val="out" title="缩小">${I('zout','sm')}</button><button class="toolbtn" data-act="zoom" data-val="in" title="放大">${I('zin','sm')}</button><button class="toolbtn" data-act="zoom" data-val="reset" title="重置缩放">${I('refresh','sm')}</button><span class="tiny-tag" style="align-self:center;background:white">${Math.round(z*100)}%</span></div>${graphFrame('ability')}</div><div class="subtle-note">这里是本地图：可在图里切换知识世界、能力路线、课程泳道。拖动旋转，滚轮缩放，单击一颗星。</div></div><aside class="inspector right-inspector"><div class="overline">选中节点</div><h4>${esc(sel.name)}</h4><p>${esc(sel.desc)}</p><div class="info-row"><span>当前进展</span><span>${esc(sel.status)}</span></div><div class="info-row"><span>前置知识</span><span>${esc(sel.parents)}</span></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:18px"><button class="btn small" data-act="ask-node">${I('message','sm')} 询问这个节点</button><button class="btn small" data-act="open-work" data-type="micro" data-mode="L">${I('arrowright','sm')} 开始微学习</button></div></aside></div>`}
function capabilityBody(){let caps=[['模型基础','已确认','confirmed'],['工具调用','需要更多证据',''],['状态管理','尚未确认',''],['任务规划','尚未确认',''],['综合项目','尚未确认','']];return `<div class="work-two"><div>${graphFrame('world')}<div class="overline" style="margin-bottom:9px">目标能力 · AI Agent 项目</div><div style="font-size:20px;font-weight:690;margin-bottom:10px">1 / 5 <span class="muted" style="font-size:12px;font-weight:400">项能力已确认（示例）</span></div><div class="progressline" style="margin-bottom:22px"><span style="width:20%"></span></div>${caps.map(c=>`<div class="cap-item" data-act="select-cap" data-id="${c[0]}"><span class="cap-dot ${c[2]}"></span><div class="cap-info"><strong>${c[0]}</strong><small>${c[1]}</small></div>${I('chevron','sm')}</div>`).join('')}<p class="subtle-note">课程内容完成与能力确认是两种不同状态，实际能力更新依赖正式证据与确认。</p></div><aside class="inspector"><div class="overline">能力详情</div><h4>${esc(st.selectedCapability)}</h4><p>${st.selectedCapability==='模型基础'?'已通过相关证据确认的能力。':'需要结合实践结果和正式证据进一步判断能力状态。'}</p><div class="info-row"><span>归属目标</span><span>Agent 开发能力</span></div><div class="info-row"><span>相关课程</span><span>AI Agent 开发基础</span></div><button class="btn small" style="margin-top:14px" data-act="ask-cap">${I('message','sm')} 询问当前能力</button></aside></div>`}
function routeBody(){return `<div class="work-two"><div>${graphFrame('lane')}<div class="overline">所属课程：AI Agent 开发基础</div><h3 style="font-size:16px;margin:9px 0 18px">${st.route.adopted?'当前路线 · V3（模拟）':'当前路线 · V2'}</h3>${[['认识 Agent 架构','已完成','done'],['工具调用基础','进行中',''],['工作流实践','下一步',''],['状态与异常处理','后续',''],['综合项目','前置未满足','']].map((r,i)=>`<div class="route-step ${r[2]}"><span class="step-mark">${r[2]==='done'?I('check','sm'):i+1}</span><div style="flex:1"><strong>${r[0]}</strong><p>${r[1]}</p></div>${i===1?`<button class="btn small" data-act="open-work" data-type="micro" data-mode="L">继续</button>`:''}</div>`).join('')}</div><aside class="inspector"><div class="overline">路线操作</div><h4>调整路线</h4><p>可以让 AI 根据当前表现提出新路线，预览不会直接修改已采用路线。</p><button class="btn small" data-act="route-preview">${I('spark','sm')} 生成建议路线</button>${st.route.suggestion?`<div style="border-top:1px solid var(--line);margin-top:17px;padding-top:16px"><div class="overline">建议路线 · 待确认</div><p style="margin-top:7px">在工作流实践之前插入「工具失败处理」微学习。</p><button class="btn small primary" data-act="route-confirm">确认采用建议</button></div>`:''}</aside></div>`}
function microBody(){const m=st.micro;const questions=[{q:'Agent 需要查询今天的天气时，最合适的做法是什么？',opts:[['guess','直接根据模型已有知识回答'],['tool','调用天气查询工具获取最新信息'],['stop','结束任务并告诉用户无法回答']],correct:'tool',explain:'天气属于实时信息，需要通过外部工具获取。模型的训练知识不保证覆盖当前天气。'},{q:'如果天气工具调用失败，Agent 更合适的做法是什么？',opts:[['fake','编造一个看起来合理的天气'],['retry','检查错误并重试，必要时向用户解释限制'],['ignore','无视错误继续输出']],correct:'retry',explain:'失败时应依据错误类型采取受控重试、降级或清楚说明限制，而不是虚构结果。'}];let q=questions[Math.min(m.step,1)];return `<div style="max-width:720px;margin:auto"><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:19px"><span class="overline">工具调用基础 · ${m.completed?'已完成':`步骤 ${m.step+1}/2`}</span><span class="fine">正式作答会进入主对话</span></div>${m.completed?`<div style="padding:30px 0;text-align:center">${I('check','xl')}<h3>微学习已完成（模拟）</h3><p class="muted" style="line-height:1.8">共 ${m.attempts.length} 次尝试；你可以重新体验，或查看当前课程路线。</p><button class="btn" data-act="micro-reset">重新体验</button><button class="btn primary" data-act="open-work" data-type="route" data-mode="L">查看当前路线</button></div>`:`<h3 style="font-size:17px;font-weight:640;line-height:1.6;margin:0 0 19px">${q.q}</h3>${q.opts.map(o=>`<label class="micro-choice ${m.answer===o[0]?'chosen':''}"><input type="radio" name="micro-answer" value="${o[0]}" ${m.answer===o[0]?'checked':''} style="position:absolute;opacity:0;width:1px"/><span class="radio-dot"></span><span>${o[1]}</span></label>`).join('')}${m.feedback?`<div class="feedback"><strong>${m.feedback.ok?'回答正确':'再试一次'}</strong><br>${esc(m.feedback.text)}</div>`:''}<div style="display:flex;gap:9px;align-items:center;margin:18px 0"><button class="btn primary" data-act="micro-answer" ${!m.answer?'disabled':''}>${m.feedback?.ok?'进入下一步':'提交本次回答'}</button><button class="btn" data-act="ask-micro">${I('message','sm')} 问 AI</button></div>`}<div class="divider" style="margin:22px 0 11px"></div><details ${m.attempts.length?'':'style="display:none"'}><summary class="fine" style="cursor:pointer">已保存 ${m.attempts.length} 次互动尝试 function practiceBody(){const p=st.practice;return `<div class="work-two"><div><div class="overline">成果实践 · AI Agent 开发基础</div><h3 style="font-size:17px;font-weight:660;margin:8px 0 10px">设计一个可调用外部工具的 Agent 工作流</h3><p class="muted" style="font-size:12px;line-height:1.85;margin:0 0 18px">请提供工作流结构、调用外部工具的说明，以及异常处理方案。可以提交文字成果或选择本地文件作为演示附件。</p><div class="form-area"><div style="font-size:12px;font-weight:650">成果内容</div><textarea id="practice-text" placeholder="在这里输入你的实现说明、步骤或成果链接……" ${p.submitted?'disabled':''}>${esc(p.text)}</textarea><div class="upload" data-act="pick-practice">${I('upload','lg')}<span>选择本地成果文件（演示不上传服务器）</span>${I('plus','sm')}</div>${p.files.map(f=>`<div class="file-item">${I('file','sm')} ${esc(f.name)} <span class="fine">${(f.size/1024).toFixed(1)} KB</span></div>`).join('')}<div style="margin-top:16px;display:flex;gap:9px"><button class="btn primary" data-act="practice-review" ${p.submitted||(!p.text.trim()&&!p.files.length)?'disabled':''}>${I('check','sm')} 确认提交成果</button><button class="btn" data-act="ask-practice">${I('message','sm')} 询问要求</button></div></div>${p.submitted?`<div class="feedback"><strong>模拟 AI 评价：${p.result?.status||'已完成'}</strong><br>${p.result?.text||''}</div>`:''}<p class="subtle-note">在主对话添加文件与正式实践提交是两种不同操作。正式提交必须明确绑定任务并经用户确认。</p></div><aside class="inspector"><div class="overline">本次实践</div><h4>提交要求</h4><div class="info-row"><span>执行内容</span><span>Agent 工作流</span></div><div class="info-row"><span>成果类型</span><span>文字 / 文件</span></div><div class="info-row"><span>当前状态</span><span>${p.submitted?'已提交 · 模拟':'草稿'}</span></div><p style="margin-top:15px">提交后自动展示模拟 AI 评价；正式产品需要可追溯的评价规则和结果。</p></aside></div>`}
function workflowBody(){const f=st.flow;return `<div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:10px"><div><div class="overline">独立工具项目</div><h3 style="font-size:16px;margin:7px 0 0">天气查询 Agent · 工作流草稿</h3></div><span class="pill">模拟执行环境</span></div><div class="mock-canvas"><svg class="canvas-flow" viewBox="0 0 750 290"><path class="canvas-conn" d="M205 132H285M455 132H530"/><rect class="canvas-node" x="55" y="93" width="150" height="78" rx="10"/><text x="75" y="124" class="canvas-node-label">输入</text><text x="75" y="146" class="canvas-node-sub">接收用户问题</text><rect class="canvas-node" x="285" y="93" width="170" height="78" rx="10"/><text x="305" y="124" class="canvas-node-label">工具调用</text><text x="305" y="146" class="canvas-node-sub">查询天气工具</text><rect class="canvas-node" x="530" y="93" width="160" height="78" rx="10"/><text x="550" y="124" class="canvas-node-label">结果输出</text><text x="550" y="146" class="canvas-node-sub">返回用户响应</text>${f.extraNode?`<rect class="canvas-node" x="287" y="202" width="168" height="63" rx="10"/><text x="307" y="229" class="canvas-node-label">错误处理</text><text x="307" y="249" class="canvas-node-sub">模拟异常分支</text><path class="canvas-conn" stroke-dasharray="5 4" d="M370 171V202"/>`:''}</svg></div><div class="canvas-footer"><div class="toolbar"><button class="btn" data-act="flow-node">${I('plus','sm')} ${f.extraNode?'移除错误处理节点':'添加错误处理节点'}</button><button class="btn" data-act="flow-save">${I('file','sm')} 保存草稿</button></div><button class="btn primary" data-act="flow-run">${I('play','sm')} 模拟运行</button></div>${f.run?`<div class="feedback"><strong>模拟运行完成</strong><br>输入 → 工具调用 → 结果输出。${f.extraNode?'已检测到异常处理分支。':'当前流程尚未添加异常处理分支。'}本次仅用于界面演示，没有实际执行 Agent。</div>`:''}</div>`}

function pageShell(title,sub,body,extra=''){return `<div class="content-scroll"><main class="page-content"><div class="page-head"><div><h1 class="page-title">${title}</h1><div class="subtitle">${sub}</div></div>${extra||headerActions()}</div>${body}</main></div>`}
function progressPage(){let tabs=[['overview','总览'],['projects','课程与项目'],['abilities','能力状态']];return pageShell('目标与进展','查看正在推进的目标、项目进度和能力状态。',`${st.projectDetail?projectDetail():`<div class="tabs" style="margin-bottom:25px">${tabs.map(t=>`<button class="tab ${st.progressTab===t[0]?'active':''}" data-act="progress-tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>${st.progressTab==='overview'?overview():st.progressTab==='projects'?projects():abilities()}`}`)}
function overview(){return `<div class="section-title" style="margin-top:0">正在推进</div><div class="grid two"><div class="tile" style="min-height:238px"><div class="tile-top"><span class="overline">主要目标</span><span class="pill">进行中</span></div><div class="tile-title" style="font-size:17px;line-height:1.5">独立开发具备工具调用能力的 AI Agent</div><div class="tile-desc">承载课程：AI Agent 开发基础</div><div class="divider" style="margin:20px 0 16px"></div><div class="overline">当前路线 · 本课程下一步</div><div style="display:flex;gap:10px;align-items:center;margin-top:10px"><span class="step-mark">2</span><span style="font-size:13px;font-weight:600">工具调用实践</span><button class="btn small" style="margin-left:auto" data-act="open-work" data-type="practice" data-mode="L">继续</button></div></div><div class="tile" style="min-height:238px"><div class="tile-top"><span class="overline">状态摘要</span>${I('target')}</div><div class="grid two" style="gap:22px"><div><div class="metric">8/15</div><span class="fine">已完成学习行动</span></div><div><div class="metric">1/5</div><span class="fine">已确认目标能力</span></div></div><div class="progressline" style="margin-top:17px"><span style="width:53%"></span></div><p class="fine" style="margin-top:15px">学习进度不等同于能力获得。完整证据可在能力状态查看。</p></div></div><h3 class="section-title">课程与项目</h3>${db.courses.slice(0,2).map(c=>`<div class="list-row"><div class="minibox">${I('book')}</div><div class="row-main"><div class="row-title">${c.name}</div><div class="row-desc">${c.desc}</div></div><span class="pill">${c.tag}</span><button class="btn small" data-act="view-project" data-id="${esc(c.name)}">查看</button></div>`).join('')}`}
function projects(){return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px"><div class="overline">全部课程与项目</div><span class="fine">按状态与最近活动组织</span></div>${db.courses.map(c=>`<div class="list-row"><div class="minibox">${I('book')}</div><div class="row-main"><div class="row-title">${c.name}</div><div class="row-desc">${c.desc}<br>${c.count}</div></div><span class="pill">${c.tag}</span><button class="btn small" data-act="view-project" data-id="${esc(c.name)}">查看项目</button></div>`).join('')}`}
function abilities(){return `<div class="grid three"><div class="tile"><div class="overline">目标能力</div><div class="metric">5</div><div class="fine">AI Agent 课程目标范围内</div></div><div class="tile"><div class="overline">已确认</div><div class="metric">1</div><div class="fine">有正式能力状态记录</div></div><div class="tile"><div class="overline">需要更多证据</div><div class="metric">4</div><div class="fine">尚未确认不表示没有学习</div></div></div><h3 class="section-title">能力模型</h3><div class="tile"><div class="tile-desc" style="margin-bottom:16px">跨课程查看已确认能力与目标差距；选择节点后可在右侧向 AI 提问。</div>${[['模型基础','已确认'],['工具调用','需要更多证据'],['状态管理','尚未确认'],['任务规划','尚未确认']].map(c=>`<div class="list-row"><span class="cap-dot ${c[1]==='已确认'?'confirmed':''}"></span><div class="row-main"><div class="row-title">${c[0]}</div><div class="row-desc">${c[1]}</div></div><button class="btn small" data-act="ask-object" data-ref="${c[0]}">询问 AI</button></div>`).join('')}<div style="margin-top:16px"><button class="btn" data-act="open-work" data-type="capability" data-mode="L">${I('expand','sm')} 在工作台打开完整模型</button></div></div>`}
function projectDetail(){let tabs=[['overview','概览'],['content','内容'],['skill','技能树'],['route','路线'],['cap','能力要求'],['results','成果']];return `<div class="breadcrumb"><button data-act="back-project">目标与进展</button>${I('chevron','sm')}<button data-act="back-project">课程与项目</button>${I('chevron','sm')}<span style="color:#444">${esc(st.projectName)}</span></div><div class="page-head"><div><h2 style="font-size:22px;margin:0 0 8px">${esc(st.projectName)}</h2><p class="subtitle">课程目标：完成具备工具调用和错误处理能力的 Agent 项目。</p></div><button class="btn" data-act="ask-object" data-ref="${esc(st.projectName)}">${I('message','sm')} 询问 AI</button></div><div class="tabs" style="margin-bottom:25px">${tabs.map(t=>`<button class="tab ${st.projectTab===t[0]?'active':''}" data-act="project-tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>${st.projectTab==='overview'?`<div class="grid two"><div class="tile"><div class="overline">完成情况</div><div class="metric">8 / 15</div><div class="tile-desc">已完成课程行动</div><div class="progressline" style="margin-top:16px"><span style="width:53%"></span></div></div><div class="tile"><div class="overline">当前路线 · 下一步</div><div class="tile-title" style="margin-top:13px">工具调用实践</div><div class="tile-desc">归属于：${esc(st.projectName)}</div><button class="btn small" style="margin-top:16px" data-act="open-work" data-type="practice" data-mode="L">继续任务</button></div></div>`:st.projectTab==='content'?`<div class="tile"><div class="tile-title">课程内容</div>${['Agent 基础','模型基础','工具调用','工作流实践','状态管理','综合项目'].map((n,i)=>`<div class="list-row"><span class="step-mark">${i+1}</span><span class="row-main">${n}</span><button class="btn small" data-act="open-work" data-type="${i<3?'micro':'practice'}" data-mode="L">查看</button></div>`).join('')}</div>`:st.projectTab==='results'?`<div class="tile"><div class="tile-title">课程成果</div><p class="tile-desc">汇总属于本课程的正式提交与评价，不混入其他课程。</p><button class="btn" data-act="nav" data-page="records">查看相关记录</button></div>`:`<div class="tile"><div class="tile-top"><div class="tile-title">${({skill:'课程技能树',route:'当前路线 · V2',cap:'课程能力要求'})[st.projectTab]}</div><span class="pill">所属课程：${esc(st.projectName)}</span></div><p class="tile-desc">${st.projectTab==='route'?'路线属于当前课程。建议路线在确认采用之前不会替换当前路线。':st.projectTab==='skill'?'查看知识节点与前置关系，也可以打开完整的交互图谱。':'查看当前课程的目标能力、差距与正式证据。'}</p><button class="btn" style="margin-top:16px" data-act="open-work" data-type="${st.projectTab==='cap'?'capability':st.projectTab}" data-mode="L">${I('expand','sm')} 在工作台展开完整视图</button><button class="btn" style="margin:16px 0 0 8px" data-act="ask-object" data-ref="${esc(st.projectName)} · ${esc(st.projectTab)}">${I('message','sm')} 询问 AI</button></div>`}`}
function resourcesPage(){let tabs=[['course','课程与训练'],['docs','知识资料'],['templates','工具与模板']];let items=st.resourceTab==='course'?db.courses:st.resourceTab==='docs'?[{name:'Agent 工具调用入门手册',desc:'相关知识资料 · 可作为对话引用',tag:'资料'},{name:'Python 异步编程说明',desc:'课程参考文档与代码示例',tag:'资料'},{name:'岗位操作规范样例',desc:'企业培训场景可用的 SOP 示范',tag:'资料'}]:[{name:'Agent 工作流起始模板',desc:'输入、工具调用、结果输出',tag:'模板'},{name:'异常处理流程',desc:'模拟执行失败时的降级结构',tag:'模板'}];let q=st.resourceSearch.trim().toLowerCase();items=items.filter(c=>`${c.name}${c.desc}`.toLowerCase().includes(q));return pageShell('资源中心','发现可使用的课程、知识资料和工具模板，优先复用已有内容。',`<div class="tabs" style="margin-bottom:24px">${tabs.map(t=>`<button class="tab ${st.resourceTab===t[0]?'active':''}" data-act="resource-tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div><div class="search-field">${I('search','sm')}<input id="resource-search" value="${esc(st.resourceSearch)}" placeholder="搜索课程、知识或模板"/></div><div class="grid two" style="margin-top:23px">${items.map((c,i)=>`<div class="tile clickable" data-act="resource-detail" data-name="${esc(c.name)}"><div class="tile-top">${I(st.resourceTab==='course'?'book':st.resourceTab==='docs'?'file':'workflow')}<span class="pill">${esc(c.tag||'课程')}</span></div><div class="tile-title">${esc(c.name)}</div><div class="tile-desc">${esc(c.desc)}</div><div style="display:flex;justify-content:flex-end;margin-top:15px;color:#59616a;font-size:11px">查看详情 ${I('arrowright','sm')}</div></div>`).join('')}</div>${items.length?'':'<div class="empty">没有匹配的资源，试试其他关键词。</div>'}<p class="subtle-note" style="margin-top:24px">需要新目标时先推荐已有课程；现有课程基本适用时，优先调整个人执行路线。</p>`)}
function allRecords(){let extra=[];st.micro.attempts.forEach((a,i)=>extra.push({type:'学习活动',date:'刚刚 · 演示',title:`工具调用微学习 · 第 ${i+1} 次尝试`,desc:a.ok?'回答正确':'需要改进',icon:'book'}));if(st.practice.submitted)extra.unshift({type:'实践成果',date:'刚刚 · 演示',title:'Agent 工作流实践 · 已模拟提交',desc:'已生成模拟 AI 评价',icon:'file'});if(st.route.adopted)extra.unshift({type:'路线变更',date:'刚刚 · 演示',title:'模拟采用建议路线 V3',desc:'AI Agent 开发基础',icon:'route'});return [...extra,...db.records]}
function recordsPage(){let filters=['全部','学习活动','实践成果','能力状态','路线变更'];let items=allRecords().filter(r=>st.recordFilter==='全部'||st.recordFilter===r.type);return pageShell('记录','按真实业务事件组织活动、成果与能力变化。对话历史请在工作台查看。',`<div class="filters">${filters.map(f=>`<button class="filter ${st.recordFilter===f?'active':''}" data-act="record-filter" data-id="${f}">${f}</button>`).join('')}</div><div class="outline-box" style="padding:5px 21px">${items.map(r=>`<div class="list-row"><div class="minibox">${I(r.icon)}</div><div class="row-main"><div class="row-title">${esc(r.title)}</div><div class="row-desc">${esc(r.date)} · ${esc(r.desc)}</div></div><span class="pill">${r.type}</span><button class="btn small" data-act="record-detail" data-title="${esc(r.title)}">查看</button></div>`).join('')}${items.length?'':'<div class="empty">该类型暂无记录。</div>'}</div>`)}
function toolsPage(){return pageShell('工具与画布','创建、编辑、模拟运行自己的工具与工作流。',`<div class="grid three"><div class="tile clickable" data-act="open-work" data-type="workflow" data-mode="R"><div class="tile-top">${I('workflow')}<span class="pill">草稿</span></div><div class="tile-title">天气查询 Agent</div><div class="tile-desc">输入 → 工具调用 → 结果输出。支持模拟编辑与运行。</div><div style="margin-top:18px;font-size:11px;color:#5e646b">打开画布 →</div></div><div class="tile clickable" data-act="open-work" data-type="workflow" data-mode="R"><div class="tile-top">${I('plus')}<span class="pill">模板</span></div><div class="tile-title">新建工作流</div><div class="tile-desc">从基础工作流结构开始设计，可在工作台展开。</div><div style="margin-top:18px;font-size:11px;color:#5e646b">开始创建 →</div></div><div class="tile clickable" data-act="nav" data-page="resources"><div class="tile-top">${I('compass')}<span class="pill">资源</span></div><div class="tile-title">浏览可复用模板</div><div class="tile-desc">从资源中心查看已有模板与资料。</div><div style="margin-top:18px;font-size:11px;color:#5e646b">浏览资源 →</div></div></div><h3 class="section-title">最近项目</h3><div class="outline-box" style="padding:0 17px"><div class="list-row"><div class="minibox">${I('workflow')}</div><div class="row-main"><div class="row-title">天气查询 Agent</div><div class="row-desc">本地示例草稿 · 模拟执行环境</div></div><button class="btn small" data-act="open-work" data-type="workflow" data-mode="R">打开工作空间</button></div></div><p class="subtle-note" style="margin-top:18px">当前画布为演示，不意味着通用 Agent 执行引擎已连接。</p>`)}
function teacherPage(){if(!(st.role==='teacher'||st.role==='both'))return pageShell('教师端','当前账号没有演示教师权限。',`<div class="empty">请通过右上角角色选择器切换为教师。</div>`);let tabs=[['courses','课程管理'],['tasks','任务与作业'],['students','学员进展'],['reviews','提交与审核']];let rows=st.teacherTab==='courses'?[['AI Agent 开发基础','已发布','15 项学习行动'],['LLM 应用开发','草稿','9 个模块']]:st.teacherTab==='tasks'?[['工作流实践','进行中','可收集文字与文件'],['工具调用微学习','已发布','互动学习任务']]:st.teacherTab==='students'?[['学员 A','进行中','8 / 15'],['学员 B','进行中','6 / 15']]:[['工作流实践提交','待审核（演示）','提交记录 001'],['课程练习成果','已评价','提交记录 002']];return pageShell('教师端','管理课程、训练任务、学员表现与成果审核。',`<div class="tabs" style="margin-bottom:23px">${tabs.map(t=>`<button class="tab ${st.teacherTab===t[0]?'active':''}" data-act="teacher-tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div><div class="toolbar" style="justify-content:space-between;margin-bottom:18px"><span class="overline">管理列表 · 演示数据</span><button class="btn" data-act="mock-manager">${I('plus','sm')} ${st.teacherTab==='courses'?'创建课程':st.teacherTab==='tasks'?'创建任务':'批量导出'}</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>名称</th><th>状态</th><th>说明</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><button class="btn small" data-act="mock-manager">查看 / 管理</button></td></tr>`).join('')}</tbody></table></div><p class="subtle-note">管理端沿用高效列表、筛选、批量操作模式，不强制改成对话卡片。</p>`)}
function adminPage(){if(!(st.role==='admin'||st.role==='both'))return pageShell('管理员端','当前账号没有演示管理员权限。',`<div class="empty">请通过右上角角色选择器切换为管理员。</div>`);let tabs=[['people','用户管理'],['org','组织管理'],['roles','角色与权限'],['system','系统配置']];let rows=st.adminTab==='people'?[['演示用户 A','普通用户','已启用'],['演示教师 B','教师','已启用']]:st.adminTab==='org'?[['演示培训组织','成员 26','正常'],['演示学院','成员 84','正常']]:st.adminTab==='roles'?[['普通用户','课程与工作空间','默认'],['教师','教学与任务管理','授权'],['管理员','组织与系统配置','授权']]:[['平台配置','运行环境','演示'],['资源访问策略','权限规则','演示']];return pageShell('管理员端','用户、组织、角色权限和系统资源的管理入口。',`<div class="tabs" style="margin-bottom:23px">${tabs.map(t=>`<button class="tab ${st.adminTab===t[0]?'active':''}" data-act="admin-tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div><div class="toolbar" style="justify-content:space-between;margin-bottom:18px"><span class="overline">管理列表 · 演示数据</span><button class="btn" data-act="mock-manager">${I('plus','sm')} 新建 / 配置</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>名称</th><th>类别</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><button class="btn small" data-act="mock-manager">详情</button></td></tr>`).join('')}</tbody></table></div>`)}
function aiDrawer(full=false){return `<aside class="${full?'full-ai':'screen-ai'}"><div class="screen-ai-head"><div style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:650">${I('spark','sm')} AI 主对话 <span class="tiny-tag">同一会话</span></div><button class="icon-btn" data-act="${full?'toggle-full-ai':'close-ai'}" aria-label="关闭 AI 面板">${I('x','sm')}</button></div><div class="chat-scroll">${msgContent(true)}</div>${composer('side')}</aside>`}
function fullOverlay(){if(st.workspace.mode!=='F'||!st.workspace.type)return '';return `<div class="full-overlay"><header class="full-header"><div style="display:flex;align-items:center;gap:13px"><button class="icon-btn" data-act="mode" data-mode="R">${I('arrowleft')}</button><strong style="font-size:14px">${labels[st.workspace.type]}</strong><span class="tiny-tag">沉浸模式</span></div><div class="toolbar"><button class="btn small" data-act="toggle-full-ai">${I('message','sm')} ${st.fullAI?'收起 AI':'打开 AI'}</button><button class="btn small" data-act="mode" data-mode="R">退出沉浸模式</button></div></header><div class="full-main"><div class="full-work">${workCard(true)}</div>${st.fullAI?aiDrawer(true):''}</div></div>`}
function modal(){if(!st.modal)return '';let m=st.modal;let content='';if(m.type==='history'){let items=st.messages.map((r,i)=>({...r,index:i})).filter(r=>!st.historyQuery||r.text.includes(st.historyQuery));content=`<h2>主工作台历史</h2><p>完整消息可以检索；较早讨论不会自动全部进入每次 AI 请求。引用后可明确加入当前消息。</p><div class="search-field" style="max-width:100%;margin-bottom:14px">${I('search','sm')}<input id="history-search" placeholder="搜索历史消息关键词" value="${esc(st.historyQuery)}"/></div><div style="max-height:280px;overflow:auto">${items.map(r=>`<div class="list-row" style="padding:10px 0"><div class="row-main"><div class="fine">${r.role==='user'?'我的消息':'AI 回答'}</div><div class="row-desc" style="color:#41484e">${esc(r.text.slice(0,100))}</div></div><button class="btn small" data-act="history-quote" data-index="${r.index}">引用</button></div>`).join('')}${items.length?'':'<div class="empty">未找到匹配消息</div>'}</div><div class="modal-actions"><button class="btn" data-act="modal-close">关闭</button></div>`}else if(m.type==='route-adopt'){content=`<h2>确认模拟采用建议路线</h2><p>建议路线将在「AI Agent 开发基础」的演示状态中标记为 V3。路线预览不会修改已采用版本；只有点击下方确认才会应用这次模拟变更。</p><div class="modal-actions"><button class="btn" data-act="modal-close">取消</button><button class="btn primary" data-act="route-adopt">确认模拟采用</button></div>`}else if(m.type==='submit'){content=`<h2>确认模拟提交成果</h2><p>本次成果将绑定到「AI Agent 开发基础 / Agent 工作流实践」。此操作会在演示中生成一次模拟提交和 AI 评价，不会上传文件到服务器。</p><div class="outline-box" style="padding:13px;font-size:12px;line-height:2"><div>文字内容：${st.practice.text.trim().length} 字</div><div>附件：${st.practice.files.length} 个（仅文件名）</div><div>任务：Agent 工作流实践</div></div><div class="modal-actions"><button class="btn" data-act="modal-close">取消</button><button class="btn primary" data-act="practice-submit">确认模拟提交</button></div>`}else{content=`<h2>${esc(m.title||'演示功能')}</h2><p>${esc(m.text||'此功能已提供交互入口，但当前原型不会写入正式业务数据。')}</p><div class="modal-actions"><button class="btn primary" data-act="modal-close">知道了</button></div>`}return `<div class="modal-back" data-act="modal-close"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(m.title||'提交确认')}" data-stop="true">${content}</div></div>`}
function render(preserveScroll=false){const scroll=document.querySelector('.chat-scroll');const scrollTop=preserveScroll&&scroll?scroll.scrollTop:null;app.innerHTML=sideNav()+`<div class="main">${topbar()}<div class="content-shell">${st.page==='workbench'?workbench():`<div class="page">${currentPage()}</div>${st.aiPanel?aiDrawer():''}`}</div></div>`+fullOverlay()+modal()+ (st.toast?`<div class="toast">${esc(st.toast)}</div>`:'');if(scrollTop!==null){const el=document.querySelector('.chat-scroll');if(el)el.scrollTop=scrollTop}if(st.page==='workbench'&&st.messages.length>2&&!preserveScroll){const el=document.querySelector('.chat-scroll');if(el)el.scrollTop=el.scrollHeight}storage()}
function toast(msg){st.toast=msg;render(true);window.clearTimeout(toast._timer);toast._timer=setTimeout(()=>{st.toast='';render(true)},2600)}
function addMsg(role,text,refs){st.messages.push({role,text,refs});if(st.messages.length>80)st.messages.splice(0,st.messages.length-80)}
function send(kind){const val=(kind==='side'?st.sideAiDraft:st.draft).trim();if(!val)return;const refs=st.context.map(k=>k==='old'&&st.historySnippet?'历史：'+st.historySnippet.slice(0,36):contexts.find(c=>c[0]===k)?.[1]||k);addMsg('user',val,refs);let answer='我已经收到你的问题。你可以在当前工作空间继续选择内容，或通过「+」引用具体题目、任务和能力节点。';if(/哪|为什|错|失败|不对/.test(val))answer='可以先检查当前任务要求、前置关系和实际输入。由于这是离线原型，我会展示引导方式，不会调用真实 AI 或做正式评分。';else if(/路线/.test(val)){answer='可以打开这门课程的路线并查看建议版本；预览不会直接修改已经采用的正式路线。';st.workspace.type='route';st.workspace.mode='S'}else if(/技能树|知识图/.test(val)){answer='已准备好课程技能树。可以将卡片展开为大型内联视图，或者移到右侧。';st.workspace.type='skill';st.workspace.mode='S'}else if(/微学习|练习题/.test(val)){answer='已准备好微学习题目，提交作答后会产生结构化的模拟反馈。';st.workspace.type='micro';st.workspace.mode='S'}else if(/实践|提交/.test(val))answer='可以在实践卡片中填写成果或选择本地文件，并在确认后模拟提交。';addMsg('assistant',answer);st.draft='';st.sideAiDraft='';st.contextOpen=false;st.context=[];render()}
function openWork(type,mode){st.page='workbench';st.aiPanel=false;st.workspace.type=type;st.workspace.mode=mode||'S';st.workspace.previous='R';st.contextOpen=false;st.mobileNav=false;render()}
function changeMode(mode){if(!st.workspace.type)return;if(mode==='F')st.workspace.previous=st.workspace.mode==='F'?'R':st.workspace.mode;st.workspace.mode=mode;st.fullAI=false;render();if(mode==='L'){const lane=app.querySelector('.chat-scroll');const card=app.querySelector('.inline-wide');if(lane&&card){const a=lane.getBoundingClientRect(),b=card.getBoundingClientRect();lane.scrollTop+=b.top-a.top-14}}}
function microAnswer(){let m=st.micro;const q=[{correct:'tool',text:'天气属于实时信息，需要通过外部工具获取，模型已有知识不能保证实时准确。',opts:{guess:'直接根据模型已有知识回答',tool:'调用天气查询工具获取最新信息',stop:'结束任务并告诉用户无法回答'}},{correct:'retry',text:'应基于错误类型进行受控重试或明确说明限制，不能编造结果。',opts:{fake:'编造一个看起来合理的天气',retry:'检查错误并重试，必要时向用户解释限制',ignore:'无视错误继续输出'}}][Math.min(m.step,1)];if(m.feedback?.ok){if(m.step===1){m.completed=true;addMsg('assistant','已完成这次微学习的两道知识检查（模拟）。你可以查看学习历程或继续下一项任务。')}else{m.step=1;m.answer='';m.feedback=null;addMsg('assistant','我们继续下一道题：工具调用失败时应该怎样处理？')}render();return}if(!m.answer)return;let ok=m.answer===q.correct;m.attempts.push({question:m.step+1,answer:m.answer,ok});addMsg('user',q.opts[m.answer],['工具调用基础 · 第 '+(m.step+1)+' 题']);const msg=ok?'回答正确。'+q.text:'还不合适。'+(m.step===0?'想一想，模型怎样得到今天的实时天气？':'要避免虚构结果，并考虑受控重试或明确说明失败。')+' 请再试一次。';addMsg('assistant',msg);m.feedback={ok,text:msg};render()}
function askThing(ref,text){if(ref){if(!st.context.includes('node')&&['技能树节点'].includes(ref))st.context.push('node');}addMsg('user',text,[ref]);addMsg('assistant','这是基于所选对象的模拟解释。正式产品会读取准确的前置关系、任务要求和证据，再生成回答。');if(st.page!=='workbench')st.aiPanel=true;render()}
function clickAction(action,ds){switch(action){case'nav':st.page=ds.page;st.mobileNav=false;st.contextOpen=false;st.aiPanel=false;st.projectDetail=false;render();break;case'toggle-side':if(window.innerWidth<=680){st.mobileNav=!st.mobileNav}else st.sidebar=st.sidebar==='expanded'?'compact':st.sidebar==='compact'?'hidden':'expanded';render(true);break;case'progress-tab':st.progressTab=ds.id;render();break;case'project-tab':st.projectTab=ds.id;render();break;case'view-project':st.projectName=ds.id;st.projectDetail=true;st.projectTab='overview';render();break;case'back-project':st.projectDetail=false;st.progressTab='projects';render();break;case'resource-tab':st.resourceTab=ds.id;st.resourceSearch='';render();break;case'record-filter':st.recordFilter=ds.id;render();break;case'teacher-tab':st.teacherTab=ds.id;render();break;case'admin-tab':st.adminTab=ds.id;render();break;case'open-work':openWork(ds.type,ds.mode);break;case'mode':changeMode(ds.mode);break;case'close-work':st.workspace.type=null;st.workspace.mode='S';st.fullAI=false;render();break;case'zoom':st.workspace.zoom=ds.val==='reset'?1:Math.min(1.45,Math.max(.75,st.workspace.zoom+(ds.val==='in'?.15:-.15)));render(true);break;case'select-node':st.workspace.selected=ds.id;render(true);break;case'select-cap':st.selectedCapability=ds.id;render(true);break;case'ask-node':st.context=['node'];askThing(nodes[st.workspace.selected].name,'请解释这个知识点，以及它与前置知识的关系。');break;case'ask-cap':askThing(st.selectedCapability,'为什么这个能力还没有确认？');break;case'ask-micro':st.context=['question'];askThing('工具调用基础 · 第 '+(st.micro.step+1)+' 题','我想进一步理解当前题目。');break;case'ask-practice':st.context=['task'];askThing('Agent 工作流实践','请解释本次实践的具体要求。');break;case'micro-answer':microAnswer();break;case'micro-reset':st.micro={step:0,answer:'',attempts:[],feedback:null,completed:false};render();break;case'practice-review':if(st.practice.text.trim()||st.practice.files.length){st.modal={type:'submit'};render()}break;case'practice-submit':st.practice.submitted=true;st.practice.result={status:'可继续改进',text:'已记录此次模拟提交。建议进一步明确工具调用失败时的处理流程。此结果不是正式 AI 评分。'};st.modal=null;addMsg('user','已确认提交 Agent 工作流实践成果（演示）。',['Agent 工作流实践']);addMsg('assistant','模拟评价已完成：当前成果能够表达基本工作流，建议补充错误处理与测试步骤。真实业务提交与正式 AI 评价需连接 EduFlow 后端。');render();break;case'pick-practice':document.getElementById('practice-file-picker').click();break;case'route-preview':st.route.suggestion=true;render(true);break;case'route-confirm':st.modal={type:'route-adopt'};render();break;case'route-adopt':st.route.adopted=true;st.route.suggestion=false;st.modal=null;toast('已在演示中采用建议路线 V3');break;case'flow-node':st.flow.extraNode=!st.flow.extraNode;render(true);break;case'flow-save':toast('模拟草稿已保留在当前演示会话中');break;case'flow-run':st.flow.run=true;render(true);break;case'ask-page':st.aiPanel=true;st.contextOpen=false;render();break;case'ask-object':st.aiPanel=true;st.context=[];addMsg('assistant',`已准备好讨论「${ds.ref||'当前内容'}」。可以直接提问，这里使用的是同一个主工作台会话。`);render();break;case'close-ai':st.aiPanel=false;render();break;case'toggle-full-ai':st.fullAI=!st.fullAI;render(true);break;case'context-menu':st.contextOpen=!st.contextOpen;render(true);break;case'toggle-ref':st.context=st.context.includes(ds.id)?st.context.filter(x=>x!==ds.id):[...st.context,ds.id];render(true);break;case'unref':st.context=st.context.filter(x=>x!==ds.id);render(true);break;case'attach-chat':document.getElementById('chat-file-picker').click();break;case'send':send(ds.kind);break;case'prompt-demo':st.draft=ds.text;send('main');break;case'resource-detail':st.modal={type:'general',title:ds.name,text:'当前资源内容为模拟数据。真实系统中可查看课程要求、匹配理由、详细内容，再决定加入或引用到主工作台。'};render();break;case'record-detail':st.modal={type:'general',title:ds.title,text:'此处用于演示从统一时间线打开正式活动及成果详情。真实结果应引用对应任务、提交、评价与能力证据。'};render();break;case'mock-manager':st.modal={type:'general',title:'管理操作 · 原型演示',text:'已展示管理入口、列表和操作位置。正式的创建、导入、审核与权限变更需要连接后端并进行权限校验。'};render();break;case'history-open':st.modal={type:'history'};st.historyQuery='';render();break;case'history-quote':st.historySnippet=st.messages[Number(ds.index)]?.text||'';st.context=['old'];st.modal=null;st.page='workbench';st.contextOpen=false;render();toast('历史讨论已加入下一条消息的引用');break;case'help':st.modal={type:'general',title:'如何体验这个原型',text:'可点击「课程技能树」打开小卡片，然后使用四个模式按钮切换 S 小型、L 大型、R 右侧、F 沉浸。侧栏按钮可连续切换展开、图标、隐藏；在目标与进展等页面点击「询问 AI」会在右侧打开同一主对话。右上角可切换演示角色。所有数据均为模拟。'};render();break;case'settings':st.modal={type:'general',title:'外观与原型设置',text:'此版使用纯白背景、浅灰边框和中性文字。左侧栏状态与演示身份会在本机保存。'};render();break;case'modal-close':st.modal=null;render(true);break;default:break}}
app.addEventListener('click',e=>{let target=e.target.closest('[data-act]');if(!target)return;if(e.target.closest('[data-stop]')&&target.classList.contains('modal-back'))return;const a=target.dataset.act;if(a==='route-adopt'){st.route.adopted=true;st.route.suggestion=false;st.modal=null;toast('已在演示中采用建议路线 V3');return}clickAction(a,target.dataset)});
app.addEventListener('change',e=>{const t=e.target;if(t.id==='role-select'){st.role=t.value;if(st.page==='teacher'&&!['teacher','both'].includes(st.role)||st.page==='admin'&&!['admin','both'].includes(st.role))st.page='workbench';render()}else if(t.id==='journey-select'){st.journey=t.value;render()}else if(t.name==='micro-answer'){st.micro.answer=t.value;st.micro.feedback=null;render(true)}});
app.addEventListener('input',e=>{const t=e.target;if(t.id==='main-draft')st.draft=t.value;else if(t.id==='side-draft')st.sideAiDraft=t.value;else if(t.id==='practice-text'){st.practice.text=t.value;storage();const b=app.querySelector('[data-act="practice-review"]');if(b)b.disabled=!(st.practice.text.trim()||st.practice.files.length)||st.practice.submitted}else if(t.id==='history-search'){st.historyQuery=t.value;const at=t.selectionStart;render(true);const target=document.getElementById('history-search');if(target){target.focus();target.setSelectionRange(at,at)}}else if(t.id==='resource-search'){st.resourceSearch=t.value;const p=t.selectionStart;render(true);let target=document.getElementById('resource-search');if(target){target.focus();target.setSelectionRange(p,p)}}});
app.addEventListener('keydown',e=>{if((e.key==='Enter'&&!e.shiftKey)&&(e.target.id==='main-draft'||e.target.id==='side-draft')){e.preventDefault();send(e.target.id==='side-draft'?'side':'main')}if(e.key==='Escape'){if(st.modal){st.modal=null;render()}else if(st.workspace.mode==='F')changeMode('R');else if(st.aiPanel){st.aiPanel=false;render()}}});
document.getElementById('practice-file-picker').addEventListener('change',e=>{st.practice.files=[...e.target.files].map(f=>({name:f.name,size:f.size}));render(true);e.target.value=''});
document.getElementById('chat-file-picker').addEventListener('change',e=>{let files=[...e.target.files];if(files.length){st.messages.push({role:'user',text:'已添加本地文件：'+files.map(f=>f.name).join('、')+'（仅演示，未上传）'});st.messages.push({role:'assistant',text:'已显示你选择的本地文件。若要作为正式实践成果，请在对应实践卡片中添加并确认提交。'});st.contextOpen=false;render()}e.target.value=''});
let splitting=false;
app.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-splitter]')||window.innerWidth<=680)return;splitting=true;document.body.style.cursor='col-resize';e.preventDefault()});
window.addEventListener('pointermove',e=>{if(!splitting)return;const root=app.querySelector('.workspace-root.mode-R');if(!root)return;const rect=root.getBoundingClientRect();const pct=(e.clientX-rect.left)/rect.width*100;st.chatShare=Math.max(27,Math.min(67,pct));root.style.setProperty('--chat-share',st.chatShare+'%')});
window.addEventListener('pointerup',()=>{if(!splitting)return;splitting=false;document.body.style.cursor=''});
render();
})();
</script>
</body>
</html>
