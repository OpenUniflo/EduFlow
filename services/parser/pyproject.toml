[project]
name = "eduflow-parser"
version = "0.1.0"
description = "EduFlow Phase 4.1 document parser worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.119.0",
    "socksio>=1.0.0",
]

[project.scripts]
eduflow-parser = "eduflow_parser.cli:main"
eduflow-parser-job = "eduflow_parser.job_worker:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eduflow_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["full_book: opt-in canonical 307-page verification"]
