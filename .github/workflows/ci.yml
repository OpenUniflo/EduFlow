name: CI

on:
  pull_request:
    branches:
      - main
      - prototype
      - feat/workflow
  push:
    branches:
      - main
      - feat/workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workflow layout
        run: pnpm workflow:check-layout

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit client secrets
        run: pnpm audit:client-secrets

  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/parser/uv.lock

      - name: Sync parser environment
        working-directory: services/parser
        run: uv sync --locked

      - name: Test real parser fixtures
        working-directory: services/parser
        run: uv run pytest -q

  workflow-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/workflow/uv.lock
      - name: Install workflow runtime
        working-directory: services/workflow
        run: uv sync --locked
      - name: Prepare pinned isolated code runtimes
        run: |
          docker pull python@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
          docker pull node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
      - name: Validate contracts and LangGraph execution
        working-directory: services/workflow
        run: uv run pytest -q
